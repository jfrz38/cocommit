name: Publish to crates.io

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-publish
  cancel-in-progress: false

jobs:
  select-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.version-check.outputs.local-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select and validate the latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          version="${tag#v}"
          test "$tag" = "v$version"
          git fetch --tags --force
          git rev-parse "$tag^{commit}" >/dev/null
          git merge-base --is-ancestor "$tag^{commit}" HEAD
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Check out selected release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false
      - name: Check version can be published
        id: version-check
        uses: jfrz38/check-version-change@c087b716b54ed45079f2440924db036f636539b3 # v1.3.1
        with:
          file-path: Cargo.toml
          package-name: cocommit
          compare-source: registry
          registry: crates-io
          fail-on-unchanged: true
          fail-on-not-higher: true
      - name: Verify selected tag matches package version
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.version-check.outputs.local-version }}
        shell: bash
        run: test "$TAG" = "v$VERSION"

  publish:
    needs: select-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crates-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select-release.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # v1.94.1
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Validate tagged release candidate
        run: make release-check-clean
      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish cocommit
        run: cargo publish --locked --token "${{ steps.crates-io-auth.outputs.token }}"
