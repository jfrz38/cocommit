name: Publish Package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-cocommit
  cancel-in-progress: false

jobs:
  validate-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      candidate_sha: ${{ steps.release.outputs.candidate_sha }}
      package_sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - name: Verify workflow runs from main
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Resolve latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq 'add | [.[] | select(.draft | not) | select(.prerelease | not)] | sort_by(.created_at) | last | .tag_name // empty')"
          if [ -z "$tag" ]; then
            echo 'No stable GitHub Release is available to publish.' >&2
            exit 1
          fi
          version="${tag#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          candidate_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "candidate_sha=$candidate_sha"
          } >> "$GITHUB_OUTPUT"
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets
      - name: Verify release assets and provenance
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          CANDIDATE_SHA: ${{ steps.release.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          package="release-assets/cocommit-$VERSION.crate"
          sbom="release-assets/cocommit-$VERSION.cdx.json"
          sums="release-assets/cocommit-$VERSION-SHA256SUMS"
          test -f "$package" && test -f "$sbom" && test -f "$sums"
          (cd release-assets && sha256sum --check "$(basename "$sums")")
          jq -e '.bomFormat == "CycloneDX"' "$sbom" >/dev/null
          gh attestation verify "$package" --repo "$GITHUB_REPOSITORY" --source-digest "$CANDIDATE_SHA" --source-ref "$TAG"
          gh attestation verify "$sbom" --repo "$GITHUB_REPOSITORY" --source-digest "$CANDIDATE_SHA" --source-ref "$TAG"
          gh attestation verify "$sums" --repo "$GITHUB_REPOSITORY" --source-digest "$CANDIDATE_SHA" --source-ref "$TAG"
          echo "sha256=$(sha256sum "$package" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Check out immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag is on main and package version matches
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git fetch origin main --tags
          git merge-base --is-ancestor "$TAG" origin/main
          test "$(sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' Cargo.toml | head -n 1)" = "$VERSION"
      - name: Check version is not already published
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: test "$(curl --silent --output /dev/null --write-out '%{http_code}' "https://crates.io/api/v1/crates/cocommit/$VERSION")" = 404

  publish:
    needs: validate-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: crates-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out validated release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-package.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up validated Rust toolchain
        uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # v1.94.1
      - name: Repackage and compare the validated release bytes
        env:
          VERSION: ${{ needs.validate-package.outputs.version }}
          EXPECTED_SHA256: ${{ needs.validate-package.outputs.package_sha256 }}
        run: |
          cargo package --locked --no-verify
          package="target/package/cocommit-$VERSION.crate"
          test "$(sha256sum "$package" | awk '{print $1}')" = "$EXPECTED_SHA256"
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish validated package
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --no-verify
