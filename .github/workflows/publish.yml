name: Publish Package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-cocommit
  cancel-in-progress: false

jobs:
  validate-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      package_sha256: ${{ steps.package.outputs.sha256 }}

    steps:
      - name: Verify workflow runs from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Publish must be run from main. Current ref is $GITHUB_REF" >&2
            exit 1
          fi

      - name: Resolve latest release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq 'add | [.[] | select(.draft | not) | select(.prerelease | not)] | sort_by(.created_at) | last | .tag_name // empty')"
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "No GitHub release found." >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag $TAG does not contain a stable semantic version." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag is on main
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch origin main --tags
          if ! git merge-base --is-ancestor "$TAG" origin/main; then
            echo "Release tag $TAG is not reachable from main" >&2
            exit 1
          fi

      - name: Verify release version matches package
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          PACKAGE_VERSION="$(sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$PACKAGE_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Release version $EXPECTED_VERSION does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi

      - name: Check version is not already published
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' "https://crates.io/api/v1/crates/cocommit/$VERSION")"
          case "$STATUS" in
            404) ;;
            200)
              echo "cocommit $VERSION is already published to crates.io" >&2
              exit 1
              ;;
            *)
              echo "Could not verify cocommit $VERSION on crates.io (HTTP $STATUS)" >&2
              exit 1
              ;;
          esac

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Verify release package
        run: make release-check-clean

      - name: Record validated package checksum
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PACKAGE="target/package/cocommit-$VERSION.crate"
          if [ ! -f "$PACKAGE" ]; then
            echo "Expected package $PACKAGE was not created." >&2
            exit 1
          fi
          echo "sha256=$(sha256sum "$PACKAGE" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

  publish:
    needs: validate-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out validated release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate-package.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up validated Rust toolchain
        uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94.1

      - name: Repackage without executing package verification
        env:
          VERSION: ${{ needs.validate-package.outputs.version }}
          EXPECTED_SHA256: ${{ needs.validate-package.outputs.package_sha256 }}
        run: |
          cargo package --locked --no-verify
          PACKAGE="target/package/cocommit-$VERSION.crate"
          ACTUAL_SHA256="$(sha256sum "$PACKAGE" | awk '{print $1}')"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "Repackaged crate checksum does not match the validated candidate." >&2
            exit 1
          fi

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --no-verify
