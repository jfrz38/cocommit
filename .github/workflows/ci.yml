name: CI

on:
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Validate workflows and shell fragments
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Install actionlint
        run: |
          archive="actionlint_1.7.7_linux_amd64.tar.gz"
          base_url="https://github.com/rhysd/actionlint/releases/download/v1.7.7"
          curl --fail --location --retry 3 --output "$archive" "$base_url/$archive"
          curl --fail --location --retry 3 --output checksums.txt "$base_url/actionlint_1.7.7_checksums.txt"
          grep " $archive$" checksums.txt | sha256sum --check --status --
          tar --extract --gzip --file "$archive" actionlint
          install --mode 0755 actionlint /usr/local/bin/actionlint
      - name: Validate GitHub Actions workflows
        run: make check-workflows

  quality:
    name: Format, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # v1.94.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Verify Git is available
        run: git --version
      - run: make check-portability

  portability:
    name: Portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # v1.94.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Verify Git is available
        run: git --version
      # Mirrors `make check-portability`; GNU Make is not guaranteed on Windows runners.
      - name: Run cross-platform quality suite
        run: |
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
           cargo build --release --locked --all-targets --all-features

  supply-chain:
    name: Dependency supply-chain policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned cargo-deny
        run: make cargo-deny-install
      - name: Enforce advisories, licenses, and sources
        run: make supply-chain-check
