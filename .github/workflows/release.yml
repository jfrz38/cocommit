name: Create Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-cocommit
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      candidate_sha: ${{ steps.candidate.outputs.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Verify candidate checkout
        id: candidate
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "Checked out commit does not match the workflow candidate." >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "Release validation requires a clean checkout." >&2
            exit 1
          fi
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify release candidate
        run: make release-check-clean

      - name: Compare package version with previous commit
        id: version-change
        uses: jfrz38/check-version-change@80c2b258363f69c3c952e05d6feaeab481f55e7f # v1
        with:
          file-path: Cargo.toml
          compare-source: git-ref
          compare-ref: HEAD^

      - name: Resolve release version
        id: version
        env:
          VERSION: ${{ steps.version-change.outputs.local-version }}
          PREVIOUS_VERSION: ${{ steps.version-change.outputs.compared-version }}
          VERSION_CHANGED: ${{ steps.version-change.outputs.changed }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Cargo.toml must contain a stable semantic version, got: $VERSION" >&2
            exit 1
          fi
          echo "Package version comparison: $PREVIOUS_VERSION -> $VERSION (changed: $VERSION_CHANGED)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  create-release:
    needs: validate-release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Create or verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-release.outputs.tag }}
          CANDIDATE_SHA: ${{ needs.validate-release.outputs.candidate_sha }}
        run: |
          TAG_OBJECT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha' 2>/dev/null || true)"
          RELEASE_EXISTS=false
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
          fi

          if [ -z "$TAG_OBJECT" ]; then
            if [ "$RELEASE_EXISTS" = true ]; then
              echo "Release $TAG exists but its tag does not." >&2
              exit 1
            fi
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$TAG" \
              -f "sha=$CANDIDATE_SHA"
            TAG_OBJECT="commit $CANDIDATE_SHA"
          fi

          TAG_TYPE="${TAG_OBJECT%% *}"
          TAG_SHA="${TAG_OBJECT#* }"
          if [ "$TAG_TYPE" != "commit" ]; then
            echo "Tag $TAG must be a lightweight tag that points directly to a commit." >&2
            exit 1
          fi

          ANCESTRY="$(gh api "repos/$GITHUB_REPOSITORY/compare/$TAG_SHA...$CANDIDATE_SHA" --jq .status)"
          if [ "$ANCESTRY" != "ahead" ] && [ "$ANCESTRY" != "identical" ]; then
            echo "Tag $TAG at $TAG_SHA is not reachable from the main candidate $CANDIDATE_SHA." >&2
            exit 1
          fi

          if [ "$RELEASE_EXISTS" = true ]; then
            echo "Release $TAG already exists for immutable tag $TAG_SHA; nothing to create."
            exit 0
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TAG_SHA" \
            --title "$TAG" \
            --generate-notes
