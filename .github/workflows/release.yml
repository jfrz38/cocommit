name: Create Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-cocommit
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      candidate_sha: ${{ steps.candidate.outputs.sha }}
      version_changed: ${{ steps.version.outputs.changed }}
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # v1.94.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Verify candidate checkout
        id: candidate
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Verify release candidate
        run: make release-check-clean
      - name: Compare package version with previous commit
        id: version-change
        uses: jfrz38/check-version-change@c087b716b54ed45079f2440924db036f636539b3 # v1.3.1
        with:
          file-path: Cargo.toml
          compare-source: git-ref
          compare-ref: HEAD^
      - name: Resolve release version
        id: version
        env:
          VERSION: ${{ steps.version-change.outputs.local-version }}
          VERSION_CHANGED: ${{ steps.version-change.outputs.changed }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "changed=$VERSION_CHANGED"
          } >> "$GITHUB_OUTPUT"
      - name: Install pinned SBOM generator
        run: cargo install cargo-cyclonedx --version 0.5.7 --locked
      - name: Produce release assets once
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          assets="target/release-assets"
          rm -rf "$assets"
          mkdir -p "$assets"
          cargo package --locked --no-verify
          package="target/package/cocommit-$VERSION.crate"
          test -f "$package"
          cp "$package" "$assets/cocommit-$VERSION.crate"
          cargo cyclonedx --format json --override-filename "cocommit-$VERSION.cdx"
          mv "cocommit-$VERSION.cdx.json" "$assets/cocommit-$VERSION.cdx.json"
          jq -e '.bomFormat == "CycloneDX"' "$assets/cocommit-$VERSION.cdx.json" >/dev/null
      - name: Transfer validated source assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-source-assets-${{ steps.version.outputs.version }}-${{ steps.candidate.outputs.sha }}
          path: target/release-assets
          if-no-files-found: error
          retention-days: 30

  build-binaries:
    needs: validate-release
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            extension: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: .exe
          - os: macos-14
            target: aarch64-apple-darwin
            extension: ''
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.candidate_sha }}
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # v1.94.1
      - name: Build and smoke-test candidate binary
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.validate-release.outputs.candidate_sha }}
          TARGET: ${{ matrix.target }}
          EXTENSION: ${{ matrix.extension }}
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          cargo build --release --locked --bin cocommit --target "$TARGET"
          binary="target/$TARGET/release/cocommit$EXTENSION"
          test "$("$binary" --version | tr -d '\r')" = "cocommit $VERSION"
          mkdir release-binary
          cp "$binary" "release-binary/cocommit-$TARGET$EXTENSION"
      - name: Transfer candidate binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binary-${{ matrix.target }}-${{ needs.validate-release.outputs.candidate_sha }}
          path: release-binary
          if-no-files-found: error
          retention-days: 30

  assemble-release-assets:
    needs: [validate-release, build-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out packaging contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.candidate_sha }}
          persist-credentials: false
      - name: Download validated source assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-source-assets-${{ needs.validate-release.outputs.version }}-${{ needs.validate-release.outputs.candidate_sha }}
          path: release-assets
      - name: Download candidate binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-binary-*-${{ needs.validate-release.outputs.candidate_sha }}
          path: release-binaries
          merge-multiple: true
      - name: Package deterministic distribution archives
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          set -euo pipefail
          bash .github/scripts/package-distribution.sh "$VERSION" x86_64-unknown-linux-gnu "release-binaries/cocommit-x86_64-unknown-linux-gnu" release-assets
          bash .github/scripts/package-distribution.sh "$VERSION" x86_64-pc-windows-msvc "release-binaries/cocommit-x86_64-pc-windows-msvc.exe" release-assets
          bash .github/scripts/package-distribution.sh "$VERSION" aarch64-apple-darwin "release-binaries/cocommit-aarch64-apple-darwin" release-assets
          (cd release-assets && find . -maxdepth 1 -type f -printf '%f\n' | sort | xargs sha256sum > "cocommit-$VERSION-SHA256SUMS")
          bash .github/scripts/verify-release-assets.sh release-assets "$VERSION"
      - name: Transfer immutable release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ needs.validate-release.outputs.version }}-${{ needs.validate-release.outputs.candidate_sha }}
          path: release-assets
          if-no-files-found: error
          retention-days: 30

  verify-release-assets:
    needs: [validate-release, assemble-release-assets]
    name: Verify ${{ matrix.target }} archive
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            extension: ''
            archive_extension: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: .exe
            archive_extension: zip
          - os: macos-14
            target: aarch64-apple-darwin
            extension: ''
            archive_extension: tar.gz
    steps:
      - name: Check out verification contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.candidate_sha }}
          persist-credentials: false
      - name: Download final assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-${{ needs.validate-release.outputs.version }}-${{ needs.validate-release.outputs.candidate_sha }}
          path: release-assets
      - name: Verify and run packaged binary
        shell: bash
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
          TARGET: ${{ matrix.target }}
          EXTENSION: ${{ matrix.extension }}
          ARCHIVE_EXTENSION: ${{ matrix.archive_extension }}
        run: |
          set -euo pipefail
          archive="release-assets/cocommit-$VERSION-$TARGET.$ARCHIVE_EXTENSION"
          bash .github/scripts/verify-distribution-archive.sh "$archive" "$VERSION" "$TARGET"
          directory="$(mktemp -d)"
          if [ "$ARCHIVE_EXTENSION" = zip ]; then
            unzip -q "$archive" -d "$directory"
          else
            tar --extract --gzip --file "$archive" -C "$directory"
          fi
          binary="$directory/cocommit-$VERSION-$TARGET/cocommit$EXTENSION"
          test "$("$binary" --version | tr -d '\r')" = "cocommit $VERSION"
          "$binary" --help >/dev/null

  create-release:
    needs: [validate-release, assemble-release-assets, verify-release-assets]
    if: github.event_name == 'push' && needs.validate-release.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out release contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.candidate_sha }}
          persist-credentials: false
      - name: Download validated assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-${{ needs.validate-release.outputs.version }}-${{ needs.validate-release.outputs.candidate_sha }}
          path: release-assets
      - name: Create or verify immutable release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-release.outputs.tag }}
          CANDIDATE_SHA: ${{ needs.validate-release.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          bash .github/scripts/verify-release-assets.sh release-assets "${TAG#v}"
          release_exists=false
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_exists=true
          fi
          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha' 2>/dev/null || true)"
          if [ -z "$tag_object" ]; then
            if [ "$release_exists" = true ]; then
              echo "Release $TAG exists but its tag does not." >&2
              exit 1
            fi
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$CANDIDATE_SHA"
            tag_object="commit $CANDIDATE_SHA"
          fi
          test "${tag_object%% *}" = commit
          tag_sha="${tag_object#* }"
          test "$tag_sha" = "$CANDIDATE_SHA"
          if [ "$release_exists" = false ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$tag_sha" --title "$TAG" --generate-notes
          fi
          mkdir existing
          for asset in release-assets/*; do
            name="${asset##*/}"
            if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir existing --clobber 2>/dev/null; then
              cmp -- "$asset" "existing/$name" || { echo "Existing asset $name differs." >&2; exit 1; }
            else
              gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY"
            fi
          done

  attest-assets:
    needs: [validate-release, create-release, verify-release-assets]
    if: github.event_name == 'push' && needs.validate-release.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download final assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-${{ needs.validate-release.outputs.version }}-${{ needs.validate-release.outputs.candidate_sha }}
          path: release-assets
      - name: Attest candidate release assets
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release-assets/*
